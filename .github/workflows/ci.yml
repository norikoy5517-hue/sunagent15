name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Required for SARIF upload to GitHub Security
permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '24.x'
  # Lines-coverage floor for the out-of-band "Check coverage threshold" step below.
  # Keep in sync with jest.config.js coverageThreshold.global.lines (currently 66).
  # This is a no-regression ratchet at the true measured level (~67.8%), NOT the goal:
  # the historical 80 was never enforced (a process.exit short-circuited jest --coverage).
  # Raise both in lockstep as tests are added for untested modules toward 80%.
  COVERAGE_THRESHOLD: 66

jobs:
  # ============================================
  # Detect Changed Paths
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'jest.config.*'
              - 'install.sh'
              - 'install.ps1'
              - 'install-release.sh'
              - 'install-release.ps1'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.claude/memory/agents/**'
              - '.claude/memory/agents-baseline.yaml'
              - '.claude/agent-source/**'
            docs:
              - 'docs/**'
              - '*.md'
              - '.claude/**'
            skills:
              - '.claude/skills/*/SKILL.md'
              - 'scripts/check-skill-requirements.js'
              - 'docs/SKILL_REQUIRES_SCHEMA.md'

  # ============================================
  # README Skill Count Sync
  # Fails when README count claims drift from actual skills/profiles.
  # ============================================
  readme-skill-count-sync:
    name: README Skill Count Sync
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/sync-readme-counts.js --check

  # ============================================
  # Context Footprint Gate
  # Fails when per-session auto-injected context (CLAUDE.md + .claude/rules/*.md)
  # exceeds the ratchet limit. Same ratchet philosophy as COVERAGE_THRESHOLD:
  # 3800 = current measured level (3739 tokens on main after PR #37 added
  # mistakes.md Pattern 15, +152 tokens) + ledger-growth headroom, NOT the goal.
  # PR #38 set 3700 measuring 3587 pre-#37; the two PRs merged green separately
  # but their combination put main over the gate (merge-order blind spot).
  # Lower toward ~1800 as Phase 3 reductions land
  # (see doc/2026-06-11_improvement-plan-sunagent15.md). Keep in sync with
  # package.json "context:check".
  # ============================================
  context-footprint-gate:
    name: Context Footprint Gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/context-footprint.js --check --limit 3800

  # ============================================
  # Plugin Metadata Sync (Pattern 10 防止)
  # Fails when .claude-plugin/{plugin,marketplace}.json drifts from
  # package.json (version) or audit-project-metadata (numeric).
  # ============================================
  plugin-metadata-sync:
    name: Plugin Metadata Sync
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/sync-plugin-metadata.js --check

  # ============================================
  # Lint & Type Check
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for hidden/bidi Unicode
        run: npm run check:unicode

      - name: Check UTF-8 encoding
        run: npm run quality:encoding -- --all

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

  # ============================================
  # Unit Tests
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --coverage --ci --runInBand
        timeout-minutes: 10

      - name: Run hook tests
        run: npx jest --testMatch='**/.claude/hooks/__tests__/**/*.test.js' --ci
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Check coverage threshold
        if: needs.changes.outputs.code == 'true'
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi

      - name: Skip coverage check (docs-only)
        if: needs.changes.outputs.code != 'true'
        run: echo "Skipping coverage threshold check for docs-only changes"

  # ============================================
  # Security Scan
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs parent commit to scan diff (commit_sha^..commit_sha).
          # Default depth=1 fails with "unknown revision" on PR commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # Build Check
  # ============================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # ============================================
  # Windows Script Validation
  # Syntax-checks PowerShell installers and regression-guards against known
  # portability bugs. Does not run the actual installer (needs TAISUN ecosystem).
  # ============================================
  windows-scripts:
    name: Windows Script Validation
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable

      - name: Syntax check PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/install.ps1',
            'scripts/setup-project.ps1',
            'scripts/quick-install.ps1'
          )
          $failed = $false
          foreach ($s in $scripts) {
            if (-not (Test-Path $s)) { continue }
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $s), [ref]$tokens, [ref]$errors
            )
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "FAIL: $s"
              $errors | ForEach-Object { Write-Host "  $_" }
              $failed = $true
            } else {
              Write-Host "OK: $s"
            }
          }
          if ($failed) { exit 1 }

      - name: Regression guard — setup-project.ps1 reads agent-source
        shell: pwsh
        run: |
          $content = Get-Content -Raw 'scripts/setup-project.ps1'
          if ($content -notmatch '\.claude\\agent-source') {
            Write-Error "setup-project.ps1 must reference .claude\agent-source (was .claude\agents, see P0 fix)"
            exit 1
          }
          Write-Host "OK: setup-project.ps1 references .claude\agent-source"

      - name: Regression guard — install.ps1 uses SkillProfile with Profile alias
        shell: pwsh
        run: |
          $content = Get-Content -Raw 'scripts/install.ps1'
          if ($content -notmatch '\[Alias\("Profile"\)\]') {
            Write-Error "install.ps1 must keep -Profile as Alias for backward compatibility"
            exit 1
          }
          if ($content -notmatch '\$SkillProfile') {
            Write-Error "install.ps1 must use `$SkillProfile (not `$Profile, which is an automatic variable)"
            exit 1
          }
          Write-Host "OK: install.ps1 uses \$SkillProfile with [Alias(\"Profile\")]"

  # ============================================
  # Installer Capability Parity Check
  # Verifies install.sh and install.ps1 both expose all flags declared in
  # scripts/installer-capability-matrix.json. Prevents drift between OSes.
  # ============================================
  installer-parity:
    name: Installer Parity Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run parity check
        run: node scripts/check-installer-parity.js

  # ============================================
  # Skill Requirements Schema Check (F8.2 Phase 2)
  # Verifies each .claude/skills/<name>/SKILL.md conforms to the
  # `requires:` schema (see docs/SKILL_REQUIRES_SCHEMA.md). Strict is
  # the default: a missing `requires:` field or a lowercase `skill.md`
  # filename fails the job. Use `--non-strict` locally only for
  # transitional work. Do NOT pass `--strict` (it is deprecated and
  # will emit a warning — strict is already the default).
  # ============================================
  skill-requirements-check:
    name: Skill Requirements Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate skill requirements schema
        run: node scripts/check-skill-requirements.js --github-summary

  # ============================================
  # Install Smoke Test (cross-OS)
  # Runs the actual installer on a clean checkout for macOS/Linux/Windows.
  # Catches release-time regressions that syntax-only checks miss.
  # ============================================
  install-smoke:
    name: Install Smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Run installer (Unix)
        if: runner.os != 'Windows'
        env:
          CI: 'true'
        shell: bash
        run: |
          set -e
          # The root install.sh detects local checkout and delegates to scripts/install.sh.
          # MCP step writes to a fresh ~/.claude/settings.json in CI runner home (safe).
          bash install.sh --profile minimal 2>&1 | tee /tmp/install-smoke.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Installer failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Run installer (Windows)
        if: runner.os == 'Windows'
        env:
          CI: 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The root install.ps1 detects local checkout and delegates to scripts/install.ps1.
          & .\install.ps1 -Profile minimal 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install-smoke.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Installer failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Verify installation (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f scripts/verify-installation.js ]; then
            node scripts/verify-installation.js
          fi

      - name: Verify installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'scripts\verify-installation.js') {
            node scripts\verify-installation.js
          }

      - name: Upload install log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-log-${{ matrix.os }}
          path: |
            /tmp/install-smoke.log
            ${{ runner.temp }}/install-smoke.log
          retention-days: 7
          if-no-files-found: ignore

  # ============================================
  # Generator Baseline Gate (PLAN.md Step 1.5 follow-up)
  # ============================================
  # Verifies scripts/generate-agents-baseline.js in all 4 modes plus dedicated unit tests.
  # Codex re-review (doc/CODEXレビュー/2026-05-14_120000_step1.5-rereview-no-go.md) F2 + new MED.
  generator-baseline-gate:
    name: Generator Baseline Gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run baseline generator unit tests
        run: npx jest --selectProjects scripts --ci
        timeout-minutes: 5

      - name: '--validate-manifest --expected-count 48 (manifest-only structural validate)'
        run: node scripts/generate-agents-baseline.js --validate-manifest --expected-count 48

      - name: '--validate-manifest --strict --expected-count 48 (post-PR-β CI gate, manifest-only + catalog cross-check)'
        # Step 1.5 follow-up³ NEW-MED-2 (Codex 4th-round 2026-05-14):
        # This mode does NOT require .claude/memory/agents/*-stats.yaml to exist.
        # PR-β (this PR) swapped --check / --check --strict for this manifest-only
        # command after deleting the source *-stats.yaml.
        run: node scripts/generate-agents-baseline.js --validate-manifest --strict --expected-count 48

  # ============================================
  # Quality Gate Summary
  # ============================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, test, security, build, windows-scripts, install-smoke, installer-parity, readme-skill-count-sync, plugin-metadata-sync, skill-requirements-check, generator-baseline-gate, context-footprint-gate]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check (incl. UTF-8) | ${{ needs.lint.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result == 'success' && '✅ Pass' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows Scripts | ${{ needs.windows-scripts.result == 'success' && '✅ Pass' || needs.windows-scripts.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Install Smoke (3 OS) | ${{ needs.install-smoke.result == 'success' && '✅ Pass' || needs.install-smoke.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| README Skill Count Sync | ${{ needs.readme-skill-count-sync.result == 'success' && '✅ Pass' || needs.readme-skill-count-sync.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plugin Metadata Sync | ${{ needs.plugin-metadata-sync.result == 'success' && '✅ Pass' || needs.plugin-metadata-sync.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skill Requirements Schema | ${{ needs.skill-requirements-check.result == 'success' && '✅ Pass' || needs.skill-requirements-check.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generator Baseline Gate | ${{ needs.generator-baseline-gate.result == 'success' && '✅ Pass' || needs.generator-baseline-gate.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Context Footprint Gate | ${{ needs.context-footprint-gate.result == 'success' && '✅ Pass' || needs.context-footprint-gate.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.windows-scripts.result }}" != "success" && "${{ needs.windows-scripts.result }}" != "skipped" ]] || \
             [[ "${{ needs.install-smoke.result }}" != "success" && "${{ needs.install-smoke.result }}" != "skipped" ]] || \
             [[ "${{ needs.readme-skill-count-sync.result }}" != "success" && "${{ needs.readme-skill-count-sync.result }}" != "skipped" ]] || \
             [[ "${{ needs.plugin-metadata-sync.result }}" != "success" && "${{ needs.plugin-metadata-sync.result }}" != "skipped" ]] || \
             [[ "${{ needs.skill-requirements-check.result }}" != "success" && "${{ needs.skill-requirements-check.result }}" != "skipped" ]] || \
             [[ "${{ needs.generator-baseline-gate.result }}" != "success" && "${{ needs.generator-baseline-gate.result }}" != "skipped" ]] || \
             [[ "${{ needs.context-footprint-gate.result }}" != "success" && "${{ needs.context-footprint-gate.result }}" != "skipped" ]]; then
            echo ""
            echo "::error::Quality gate failed. Please fix the issues above."
            exit 1
          fi

          echo ""
          echo "✅ All quality gates passed!"
